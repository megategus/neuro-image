name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock
      - name: Pipeline tests (no network)
        working-directory: pipeline
        run: |
          uv sync --locked
          uv run --locked pytest -m "not network"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Site tests
        working-directory: site
        run: |
          npm ci
          npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      # Fails (and stops the job) if a lesson whose maps are all verified is
      # unreviewed, a verified map's caveat is unreviewed (caveat_reviewed),
      # any text still contains TODO, or a map lacks required metadata. Do not add
      # continue-on-error: the build writes its outputs even when it fails.
      - name: Build data (deploy gate)
        working-directory: pipeline
        run: |
          uv sync --locked
          uv run --locked python -m atlas_pipeline build --deploy --out ../site/public/data
      - name: Build site
        working-directory: site
        run: |
          npm ci
          npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
      - id: deployment
        uses: actions/deploy-pages@v4
