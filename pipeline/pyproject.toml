[project]
name = "atlas-pipeline"
version = "0.1.0"
description = "Data pipeline for the brain condition atlas"
requires-python = ">=3.11"
dependencies = ["pyyaml"]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
