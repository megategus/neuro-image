# Registry of published maps. Field notes:
# - threshold: in the map's own value units (the number compared with voxel
#   values), exactly as the authors state it. A p-value stated for a z- or
#   t-map must first be converted to that map's units; never choose one.
# - caveat_reviewed: set to true only after the medical reviewer has approved
#   this source's caveat text. `build --deploy` fails for a verified source
#   whose caveat is not reviewed.
sources:
  - id: anger
    label: Anger
    group: emotion
    study_id: wager2015
    url: https://raw.githubusercontent.com/canlab/Neuroimaging_Pattern_Masks/master/CANlab_Meta_analysis_maps/2015_Wager_Kang_etal_Emotion_Meta_BSPP/Wager_Kang_PlosCB_emometa_2015_anger.nii.gz
    sha256: 925da717c6894ae21bbc22a43f21fd5fa6071236fffa6162420ce519441dd8c4
    status: verified
    citation: "Wager TD, Kang J, Johnson TD, Nichols TE, Satpute AB, Barrett LF (2015). A Bayesian model of category-specific emotional brain responses. PLoS Comput Biol 11(4):e1004066."
    doi: 10.1371/journal.pcbi.1004066
    n_studies: 148
    method: "Bayesian spatial point process (BSPP) coordinate-based meta-analysis"
    value_meaning: "posterior expected number of activation centres"
    threshold: 0.001
    threshold_type: display-only
    licence: "GPL-3.0 (CANlab repository); article CC-BY 4.0"
    caveat: "Shows where studies of anger tended to report activation peaks, as estimated by a statistical model; no single coloured region is specific to anger; what differs between emotions is the overall pattern. The map has no negative values, so it cannot show decreases, and the 0.001 cut is a display choice, not a significance test."
    caveat_reviewed: false
